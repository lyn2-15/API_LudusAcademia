version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ludus_api_v2
    environment:
      APP_ENV: development
      DATABASE_PATH: /data/ludusacademia.db
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      ALLOW_PUBLIC_DOCENTE_ENDPOINTS: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app          # Hot reload en desarrollo
      - sqlite_data:/data        # Persistencia del archivo .db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  sqlite_data:
